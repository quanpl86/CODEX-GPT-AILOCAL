name: Toolkit verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run offline checks
        shell: pwsh
        run: ./Test-ProjectAI.ps1
      - name: Build allowlisted deployment kit
        shell: pwsh
        run: ./New-DeploymentPackage.ps1
      - name: Upload verified kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-local-deployment-kit
          path: dist/ai-local-kit-*.zip
          if-no-files-found: error
          retention-days: 14
